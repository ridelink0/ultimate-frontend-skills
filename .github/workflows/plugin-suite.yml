name: Consolidated plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  suite-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/suite-check.mjs
      - run: node --test test/suite.test.mjs
  usage-limits:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/usage-limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node bin/cli.js --version
  image-research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/image-deep-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Allow Chrome sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test image research with a real browser
        shell: bash
        env:
          IDR_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          node --test --test-concurrency=1 test/*.test.mjs | tee image-tests.tap
          if grep -qE '^# (skipped|cancelled) [1-9]' image-tests.tap; then
            echo 'Image research tests were skipped or cancelled.' >&2
            exit 1
          fi
