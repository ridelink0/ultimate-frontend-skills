name: WebGL readback diagnosis (throwaway branch)
on: [push]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
      - name: repro across GPU flag sets
        shell: bash
        env:
          BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          UFS_INSPECT: scripts/inspect.mjs
          SETS: '[[],["--disable-gpu"],["--enable-unsafe-swiftshader"],["--use-angle=swiftshader","--enable-unsafe-swiftshader"],["--use-angle=d3d11-warp"],["--use-angle=d3d11"],["--use-gl=angle","--use-angle=swiftshader-webgl"]]'
        run: node ci-diag/repro.mjs
      - name: the failing field test alone
        shell: bash
        env:
          ATELIER_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node --test --test-name-pattern="a game title screen" test/field-tests.test.mjs || true
